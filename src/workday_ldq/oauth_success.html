<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authorization Successful</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 2rem;
            background: #f5f5f5;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            max-width: 400px;
            margin: 2rem auto;
        }
        .success-icon {
            font-size: 3rem;
            color: #10b981;
        }
        h1 {
            color: #333;
            margin: 1rem 0;
        }
        p {
            color: #666;
            margin: 0.5rem 0;
        }
        .countdown {
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="success-icon">✓</div>
    <h1>Authorization Successful</h1>
    <p>You have been successfully authenticated.</p>
    <p>This window will close in <span class="countdown" id="countdown">3</span> seconds...</p>
</div>
<script>
    let seconds = 3;
    const countdownElement = document.getElementById('countdown');

    const interval = setInterval(() => {
        seconds--;
        countdownElement.textContent = String(seconds);

        if (seconds <= 0) {
            clearInterval(interval);
            window.close();

            // Fallback if the browser window doesn't close
            setTimeout(() => {
                document.querySelector('.container').innerHTML =
                    '<div class="success-icon">✓</div>' +
                    '<h1>Authorization Successful</h1>' +
                    '<p>You can now close this window.</p>';
            }, 100);
        }
    }, 1000);
</script>
</body>
</html>
