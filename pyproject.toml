[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ldq-python-client"
version = "1.1.2"
description = "Python connector for Workday Live Data Query (LDQ) service."
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
classifiers = [
    "Intended Audience :: Users",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "trino>=0.337.0",
    "PyJWT>=2.8.0",
    "requests>=2.33.0",
    "cryptography>=49.0.0",
    "urllib3>=2.7.0",
    "orjson>=3.11.6",
    "importlib_resources>=5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
    "flake8>=6.0",
    "types-requests>=2.31.0",
    "pdoc>=14.0",
]
docs = [
    "pdoc>=14.0",
]
pandas = ["pandas>=1.5.0"]
jupyter = ["jupyter>=1.0.0", "ipython>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workday_ldq = ["py.typed", "oauth_success.html"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests requiring a live environment and browser login (deselect with '-m not integration')",
]
